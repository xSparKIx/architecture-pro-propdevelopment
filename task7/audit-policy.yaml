apiVersion: audit.k8s.io/v1
kind: Policy
rules:
  - level: Metadata
    namespaces: ["audit-zone"]
    resources:
      - group: ""
        resources: ["pods"]
    omitStages:
      - RequestReceived

  - level: RequestResponse
    namespaces: ["audit-zone"]
    resources:
      - group: ""
        resources: ["pods"]
    verbs: ["create", "update", "patch", "delete"]
    omitStages:
      - RequestReceived

  - level: Metadata
    namespaces: ["gatekeeper-system"]
    resources:
      - group: "constraints.gatekeeper.sh"
        resources: ["*"]
    omitStages:
      - RequestReceived